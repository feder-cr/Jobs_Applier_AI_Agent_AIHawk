[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aihawk"
version = "0.1.0"
description = "Drive a stealth browser with an LLM from one command"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "feder-cr", email = "85809106+feder-cr@users.noreply.github.com" }]
dependencies = [
    # The floor is 0.9.0 and not "any": the tab strip needs `session_list_pages`
    # to return id, title, url and active, and every earlier version answered
    # with ids alone while its description promised those four. Against 0.8.1 the
    # strip stays empty and everything else works, which is a deliberate path
    # rather than a fault - but shipping a version that silently loses a feature
    # is not something to leave to chance. Set only after 0.9.0 was on the index,
    # never before: a pin to something unpublished is a package nobody can
    # install.
    "invisible-playwright-mcp>=0.9.0",
    "mcp>=1.2",
    "openai>=1.30",
    "click>=8.1",
    # Declared even though `mcp` already pulls both in for streamable-http. This
    # package now serves its own app rather than riding somebody else's, so it
    # imports them directly, and a dependency you import is one you declare: the
    # day mcp stops needing them, the failure would otherwise land here.
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
aihawk = "aihawk.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aihawk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# `ui` tests launch a real browser through a real MCP server. They are slow,
# they must run serially, and two of them running at once give false results,
# so they are deselected by default and asked for by name:
#     pytest -m ui -q tests/test_ui_drive.py
markers = [
    "ui: drives a real browser through a real MCP server (slow, serial, opt-in)",
]
addopts = "-m 'not ui'"
